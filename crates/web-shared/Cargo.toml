[package]
name = "web-shared"
version = "0.1.1"
edition = "2021"
description = "Shared types for web and TUI frontends"
license = "MIT"
repository = "https://github.com/yourusername/imsa_tui"
readme = "README.md"
keywords = ["timing", "racing", "shared"]
categories = ["web-programming", "data-structures"]

[package.metadata.ts-rs]
export_to = "../../web/src/lib/generated"

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "10", features = ["chrono-impl", "ordered-float-impl"] }
