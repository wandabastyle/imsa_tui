[workspace]
members = [".", "crates/web-shared"]
resolver = "2"

[package]
name = "imsa_tui"
version = "0.7.1"
edition = "2021"
description = "A terminal user interface for timing data"
license = "MIT"
repository = "https://github.com/yourusername/imsa_tui"
keywords = ["timing", "racing", "motorsport", "tui"]
categories = ["command-line-utilities"]

[features]
default = ["embed-ui"]
embed-ui = ["dep:include_dir"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "deflate", "query"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
mime_guess = "2"
rand = "0.10"
argon2 = "0.5"
libc = "0.2"
include_dir = { version = "0.7", optional = true }
web-shared = { path = "crates/web-shared" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.release.package.imsa_tui]
opt-level = 3

[lints.clippy]
all      = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Too noisy / low-value for this application.
nursery = { level = "allow", priority = -1 }

# Ecosystem noise from transitive dependencies.
multiple_crate_versions = { level = "allow", priority = 1 }

# Useful API-contract lints.
must_use_candidate = "warn"
return_self_not_must_use = "warn"

# Relax noisy pedantic lints globally.
too_many_lines = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
